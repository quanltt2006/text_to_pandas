# Render Blueprint — backend web service cho Smart CSV Analyst
# Cách dùng: Render Dashboard -> New + -> Blueprint -> chọn repo -> sync.
# Backend sẽ được deploy với URL dạng https://text-to-pandas-backend-xxx.onrender.com
# Sau đó thêm env VITE_API_BASE trên static site frontend (xem README / hướng dẫn).
services:
  - type: web
    name: text-to-pandas-backend
    env: python
    plan: free
    region: singapore
    rootDirectory: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_ROUTER_MODEL
        value: qwen/qwen3.8-27b
      - key: MAX_FILE_SIZE_MB
        value: "50"
      # Nhập GROQ_API_KEY trong Dashboard sau khi sync (nút "Save of sync: false")
      - key: GROQ_API_KEY
        sync: false